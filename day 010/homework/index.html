<!-- text - ტექსტის შესაყვანი ველი -->
<input type="text">

<!-- password - პაროლის შესაყვანი ველი (სიმბოლოები დამალულია) -->
<input type="password">

<!-- email - ელფოსტის შესაყვანი ველი -->
<input type="email">

<!-- number - რიცხვის შესაყვანი ველი -->
<input type="number">

<!-- checkbox - მონიშვნის პატარა კვადრატი -->
<input type="checkbox">

<!-- radio - არჩევის ღილაკი, რომელშიც მხოლოდ ერთი აირჩევა -->
<input type="radio">

<!-- file - ფაილის ატვირთვის ველი -->
<input type="file">

<!-- date - თარიღის შესაყვანი ველი -->
<input type="date">

<!-- submit - ფორმის გაგზავნის ღილაკი -->
<input type="submit">

<!-- button - ჩვეულებრივი ღილაკი -->
<input type="button">

<!-- range - სლაიდერი მნიშვნელობის ასარჩევად -->
<input type="range">





<!-- name ატრიბუტი გამოიყენება იმისთვის, რომ ველი ან ღილაკი აიდენტიფიცირდეს ფორმის მონაცემებში
როცა ფორმას გაგზავნით, server-ზე name-ით გაიგებენ, რა მნიშვნელობა შეყვანილია -->



<!DOCTYPE html>
<html>
<head>
<title>Radio Form</title>
</head>

<body>

<h2>აირჩიეთ თქვენი საყვარელი სეზონი</h2>

<form>
    <input type="radio" name="season" value="spring"> გაზაფხული<br>
    <input type="radio" name="season" value="summer"> ზაფხული<br>
    <input type="radio" name="season" value="autumn"> შემოდგომა<br>
    <input type="radio" name="season" value="winter"> ზამთარი<br>
</form>

</body>
</html>
